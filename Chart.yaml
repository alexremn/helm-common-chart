  artifacthub.io/changes: |
    - kind: fixed
      description: "global.extraLabels and a caller-supplied extraLabels now OVERRIDE a chart-emitted label of the same key instead of being appended after it as a second YAML block. Overriding one -- pinning app.kubernetes.io/managed-by back to Helm under deployTool: argocd, say, so the label reads the same across a mixed werf/ArgoCD fleet -- previously emitted the key twice, and every strict decoder (kubeconform -strict, the API server's YAML-to-JSON step) rejected every document in the file with 'key ... already set in map'. There was therefore no way to override a chart label at all. This is the same duplicate-mapping-key defect 2.5.0 fixed for annotations. The emission ORDER of the chart's own labels is unchanged, so a consumer that overrides nothing sees no render diff"
    - kind: changed
      description: "label values sourced from extraLabels are now quoted. A Kubernetes label value must be a string, and an unquoted numeric one (team: 2024) is rejected at apply time -- the same trap helm.sh/environment was quoted for in 2.5.0. Consumers already setting extraLabels see a one-time, non-functional quoting diff; global.extraLabels only became reachable in 2.5.0, so this is a narrow surface"
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
