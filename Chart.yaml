type: library
version: "2.8.1"
kubeVersion: ">=1.24-0"
home: https://github.com/alexremn/helm-common-chart
sources:
  - https://github.com/alexremn/helm-common-chart
maintainers:
  - name: Alex Remniov
    url: https://remniov.com
keywords:
  - common
  - library
  - kubernetes
  - helm
icon: https://raw.githubusercontent.com/alexremn/helm-common-chart/main/icon.png
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/alexremn/helm-common-chart
    - name: Migration v1 → v2
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/migration-v1-to-v2.md
    - name: Values reference
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/values-reference.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "chart.ingress: in a list-style <cmp>.ingress, each entry's own annotations leaked into every later entry of that component whenever global.ingress.annotations was non-empty, because ingress.annotations merged into the shared base map in place. Each entry now gets global.ingress.annotations plus its own annotations only; consumers with that shape see the leaked annotations disappear from the later Ingresses on the next render."
    - kind: fixed
      description: "integers >= 1e6 passed via --set and read by a helper (e.g. global.image.tag, global.pdb.minAvailable) no longer render in float notation: --set global.image.tag=20240101 used to produce the invalid image reference nginx:2.0240101e+07."
    - kind: changed
      description: "helpers no longer round-trip .Values through toYaml/fromYaml on every call; they take a shallow copy with omit instead. Rendering a ~40-component chart drops from minutes to about a second. Output is otherwise unchanged, including for helpers called without Values or root."
    - kind: deprecated
      description: "common._values. The chart no longer calls it; omit (default dict .Values) gives the plain map dig needs without the YAML round-trip. Kept for consumers that include it."
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
