apiVersion: v2
name: common
description: Library Helm chart providing reusable templates for Kubernetes workloads, services, autoscaling, and observability.
type: library
version: "2.8.3"
kubeVersion: ">=1.24-0"
home: https://github.com/alexremn/helm-common-chart
sources:
  - https://github.com/alexremn/helm-common-chart
maintainers:
  - name: Alex Remniov
    url: https://remniov.com
keywords:
  - common
  - library
  - kubernetes
  - helm
icon: https://raw.githubusercontent.com/alexremn/helm-common-chart/main/icon.png
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/alexremn/helm-common-chart
    - name: Migration v1 → v2
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/migration-v1-to-v2.md
    - name: Values reference
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/values-reference.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "an explicit 0 is now honoured wherever it differs from unset; before, default replaced it or with/coalesce dropped the field. replicas 0 (Deployment, StatefulSet) rendered 1; Deployment minReadySeconds 0 rendered 10; revisionHistoryLimit 0 (Deployment, StatefulSet, DaemonSet) was dropped, so Kubernetes kept 10; terminationGracePeriod 0 rendered 30; ScaledObject scaling.fallback 0 rendered 1."
    - kind: fixed
      description: "Job and CronJob ttlSecondsAfterFinished: 0 was dropped, so the Job got no TTL and stayed until something else deleted it; it now renders 0 (delete as soon as the Job finishes)."
    - kind: fixed
      description: "rails-profile tolerations: tolerationSeconds: 0 was dropped, which tolerates the taint forever instead of evicting immediately. Other profiles pass tolerations through unchanged and were not affected."
    - kind: changed
      description: "consumers that set any of these fields to an unquoted 0 see it take effect on the next render (e.g. replicas: 0 scales the workload to zero). Unset and null render exactly as before, and a quoted \"0\" keeps working."
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
