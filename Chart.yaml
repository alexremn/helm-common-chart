      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/values-reference.md
  artifacthub.io/changes: |
    - kind: added
      description: "global.deployment.minReadySeconds, progressDeadlineSeconds, strategyMaxSurge and strategyMaxUnavailable: chart-wide fallbacks for the Deployment rollout keys. Each key resolves as <component>.<key>, then global.deployment.<key>, then the built-in default (10, omitted, 1, 25%). A global 0 is honoured for minReadySeconds, strategyMaxSurge and strategyMaxUnavailable; progressDeadlineSeconds: 0 counts as unset at either level. StatefulSet and DaemonSet are not affected."
    - kind: changed
      description: "charts that set none of the four global keys render exactly as before. Once a global key is set, a component-level 0 for strategyMaxSurge or strategyMaxUnavailable (already discarded in favour of the built-in default) falls through to the global value instead."
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
