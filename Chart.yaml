apiVersion: v2
name: common
description: Library Helm chart providing reusable templates for Kubernetes workloads, services, autoscaling, and observability.
type: library
version: "2.9.0"
kubeVersion: ">=1.24-0"
home: https://github.com/alexremn/helm-common-chart
sources:
  - https://github.com/alexremn/helm-common-chart
maintainers:
  - name: Alex Remniov
    url: https://remniov.com
keywords:
  - common
  - library
  - kubernetes
  - helm
icon: https://raw.githubusercontent.com/alexremn/helm-common-chart/main/icon.png
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/alexremn/helm-common-chart
    - name: Migration v1 → v2
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/migration-v1-to-v2.md
    - name: Values reference
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/values-reference.md
  artifacthub.io/changes: |
    - kind: added
      description: "chart.agentgatewaypolicy: one agentgateway.dev/v1alpha1 AgentgatewayPolicy per <component>.agentgatewayPolicies entry (the policy spec as is, plus optional annotations), for clusters whose Gateway API implementation is agentgateway. Without targetRefs or targetSelectors an entry targets every HTTPRoute chart.httproute renders for the component; on a component without a route that is a render error."
    - kind: added
      description: "chart.httproute passes a rule's name through, so a policy can target one rule by sectionName."
    - kind: changed
      description: "charts that set neither agentgatewayPolicies nor a rule name render exactly as before. A rules[].name that was already set used to be dropped and is now rendered."
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
