  artifacthub.io/changes: |
    - kind: fixed
      description: "chart.cronjob: an explicit successfulJobsHistoryLimit: 0 or failedJobsHistoryLimit: 0 rendered 1, because default treats an integer 0 as empty. Both limits now fall back to 1 only when unset or null, so 0 keeps no finished Jobs. Consumers that set 0 see the CronJob stop retaining its last Job on the next render; the quoted \"0\" workaround keeps working."
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
