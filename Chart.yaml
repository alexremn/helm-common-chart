icon: https://raw.githubusercontent.com/alexremn/helm-common-chart/main/icon.png
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/alexremn/helm-common-chart
    - name: Migration v1 → v2
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/migration-v1-to-v2.md
    - name: Values reference
      url: https://github.com/alexremn/helm-common-chart/blob/main/docs/values-reference.md
  artifacthub.io/changes: |
    - kind: added
      description: "common.dbPool -- worker-per-core connection-pool sizing (workers or cpu quantity, threads, extra). Ported from the Hubstaff product charts, where four byte-identical copies had drifted apart from the library."
    - kind: added
      description: "config.define gains type (full|value), the same output switch secrets.retrieve and secrets.define already had, so a looked-up ConfigMap value can be composed inside a tpl'd string. An unknown type fails the render."
    - kind: added
      description: "secrets.define gains generate (default true). generate: false makes it a pure read-back -- existing value, else the supplied value, else empty -- never a random; a nil value renders as \"\" rather than \"<nil>\"."
    - kind: changed
      description: "chart.configmap now fails the render on a null value under configs.<name>.data or <cmp>.configmap.data, naming the key. Helm keeps a null that arrives from a values file or --set, and toString on nil is the literal \"<nil>\", which shipped to pods as a set-but-garbage variable. No intentional use of a null ConfigMap value exists; consumers hitting the new failure have a typo in an environment values file."
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
