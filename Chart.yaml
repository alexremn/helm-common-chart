  artifacthub.io/changes: |
    - kind: fixed
      description: "scaledobject: triggers[].metadata.enableTLS and the prometheus serverAddress are now quoted. KEDA's CRD types triggers[].metadata as map[string]string, so the unquoted `true` the redis trigger emitted rendered a YAML boolean and the API server rejected the entire ScaledObject with `got boolean, want string`. Every other key in that block was already quoted; these two were not. Consumers using redis triggers could not apply their ScaledObjects at all."
    - kind: added
      description: "<cmp>.selectorLabels -- per-component selector labels, merged over the chart-wide global.selectorLabels and landing in both common.labels and every generated selector. Unlike the chart-wide map these can differ per component, which is what lets one chart reproduce a pre-existing grouped selector during a migration: a Deployment named web-general selecting on {name, part-of: web, component: general}. The component map is read from .Values.<key>, .Values.cronjobs.<key> or .Values.jobs.<key> (first hit wins, each guarded on the node being a map). Selectors are IMMUTABLE, so these keys are new-install-only on a live workload, exactly like global.selectorLabels"
    - kind: fixed
      description: "selector labels now OVERRIDE a chart-emitted label of the same key instead of being appended after it. Setting global.selectorLabels to a map containing app.kubernetes.io/component previously emitted that key TWICE in both metadata.labels and spec.selector.matchLabels, and every strict decoder (kubeconform -strict, the API server's YAML-to-JSON step) rejects a duplicate mapping key -- so the only keys the chart-wide map could safely carry were ones the chart never emits. Same duplicate-mapping-key defect 2.5.0 fixed for annotations and 2.5.1 for extraLabels; selector labels were the remaining path"
    - kind: changed
      description: "label values sourced from selectorLabels are now quoted, matching extraLabels since 2.5.1. A Kubernetes label value must be a string and an unquoted numeric one (tenant: 2024) is rejected at apply time. Consumers already setting global.selectorLabels see a one-time, non-functional quoting diff; where such a label reaches a pod template this also changes a checksum/config annotation once, so those pods roll once on the next deploy"
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/alexremn/helm-common-chart/blob/main/SECURITY.md#verification
