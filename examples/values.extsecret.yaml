# ExternalSecret entries (chart.extsecret).
#
# Each key under `secrets` becomes one ExternalSecret whose target Secret is
# named after it, so `envFrom.secrets: [app-db]` picks it up unchanged.

global:
  # Default store for every entry; override per secret with `secretStore`.
  secretStore: my-cluster-store

web:
  ports:
    http: 8080
  envFrom:
    secrets:
      - app-db
      - app-pki

secrets:
  # ---------------------------------------------------------------------------
  # properties as a LIST: the remote field name is also the key written into
  # the Secret. Use this when the store's field names already match the env
  # vars the workload reads.
  # ---------------------------------------------------------------------------
  app-db:
    secretKey: secret/data/app/db
    properties:
      - DB_USERNAME
      - DB_PASSWORD

  # ---------------------------------------------------------------------------
  # properties as a MAP: <secretKey>: <remoteProperty>. Use this when the field
  # names in the store differ from the env vars the workload expects — common
  # with Vault paths that use kebab-case fields.
  # ---------------------------------------------------------------------------
  app-pki:
    secretKey: secret/data/app/pki
    secretStore: pki-store
    properties:
      CA_CERT: ca-certificate
      CA_PRIVATE_KEY: ca-private-key
      UID_SECRET_KEY: uid-secret-key

  # ---------------------------------------------------------------------------
  # dataFrom pulls every field of a remote secret; combine with `template` when
  # you need to reshape or rename after the fetch.
  # ---------------------------------------------------------------------------
  app-bulk:
    dataFrom:
      - extract:
          key: secret/data/app/bulk
    template:
      mergePolicy: Replace
      engineVersion: v2
      data:
        RENDERED_TOKEN: '{{ index . "raw-token" }}'
