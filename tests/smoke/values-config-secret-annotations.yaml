name: config-secret-annotations-app
environment: dev

global:
  image:
    repository: ghcr.io/example/api
    tag: "1.0.0"

# Regression cover: before 2.4.1 these `annotations` keys were accepted by the schema but never
# rendered, so consumers (e.g. Argo CD sync-waves) had no way to annotate a ConfigMap or an
# ExternalSecret. They must now appear, merged AFTER the chart defaults.
configs:
  app-config:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"
      example.com/owner: platform
    data:
      LOG_LEVEL: info

secrets:
  app-secrets:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"
    secretStore: my-store
    secretKey: /apps/internal/api
    properties:
      - DB_PASSWORD
