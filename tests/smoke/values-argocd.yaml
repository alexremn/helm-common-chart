# Full-surface ArgoCD dialect fixture. Mirrors values-generic.yaml so the two
# goldens can be diffed against each other to see exactly what the dialect
# changes.
name: argocd-app
environment: staging

global:
  deployTool: argocd
  image:
    repository: ghcr.io/example/app
    tag: "1.0.0"
  secretStore: my-cluster-store
  prometheusEndpoint: http://prometheus.monitoring:9090
  persistence:
    retain: true
  # F3: a chart-wide annotation colliding with a chart-emitted default must
  # merge into one key, not render twice (kubeconform -strict rejects a
  # duplicate mapping key). sync-wave collides with the ConfigMap/ExternalSecret
  # ordering default ("-1"); sync-options collides with the Prune=false the
  # chart emits on PriorityClass/ClusterRole/ClusterRoleBinding and, via
  # persistence.retain above, PVC — exercising the union-not-overwrite
  # semantics that keep Prune=false even when a consumer also sets sync-options.
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: ServerSideApply=true

web:
  ports:
    http: 8080
  configmap:
    data:
      APP_MODE: "internal"
  # `scaling` without `triggers` renders `triggers: null`, which KEDA rejects —
  # every other scaling fixture in this suite sets triggers, so match them. The
  # prometheus trigger's `query` also gives Task 12's `tpl`-gate change a real
  # surface to be verified against.
  scaling:
    min: 2
    max: 5
    triggers:
      - type: prometheus
        threshold: "1"
        query: vector(1)
  # Per-component cluster RBAC requires the `.clusterRole` nesting — a bare
  # `rbacCluster.rules` renders nothing. Exercises Task 15's Prune=false on a
  # shared ClusterRole under argocd.
  rbacCluster:
    clusterRole:
      rules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]
  # G1: podAnnotations colliding with the chart-computed checksum/config must
  # merge into one key (same duplicate-mapping-key failure mode as the F3
  # annotations above), with the consumer's value winning -- a consumer who
  # sets this key is overriding the chart's rollout hash deliberately. The
  # unrelated key alongside it proves the merge doesn't drop other entries.
  podAnnotations:
    checksum/config: consumer-supplied-checksum
    example.com/owned-by: platform-team

stateful:
  ports:
    http: 8081
  persistence:
    - name: data
      size: 1Gi

priorityClasses:
  argocd-high:
    value: 1000
    description: "shared cluster-scoped object — two Applications may declare it"

configs:
  app-config:
    data:
      LOG_LEVEL: "info"

secrets:
  app-secrets:
    secretKey: "internal/app/staging"
    properties:
      - API_KEY

jobs:
  run_task:
    hook: PreSync
    command: ["/bin/sh", "-c"]
    args: ["echo migrate"]

cronjobs:
  sync_task:
    schedule: "0 * * * *"
    command: ["/bin/sh", "-c"]
    args: ["echo sync"]
    jobAnnotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
