# Full-surface ArgoCD dialect fixture. Mirrors values-generic.yaml so the two
# goldens can be diffed against each other to see exactly what the dialect
# changes.
name: argocd-app
environment: staging

global:
  deployTool: argocd
  image:
    repository: ghcr.io/example/app
    tag: "1.0.0"
  secretStore: my-cluster-store
  prometheusEndpoint: http://prometheus.monitoring:9090
  persistence:
    retain: true

web:
  ports:
    http: 8080
  configmap:
    data:
      APP_MODE: "internal"
  # `scaling` without `triggers` renders `triggers: null`, which KEDA rejects —
  # every other scaling fixture in this suite sets triggers, so match them. The
  # prometheus trigger's `query` also gives Task 12's `tpl`-gate change a real
  # surface to be verified against.
  scaling:
    min: 2
    max: 5
    triggers:
      - type: prometheus
        threshold: "1"
        query: vector(1)
  # Per-component cluster RBAC requires the `.clusterRole` nesting — a bare
  # `rbacCluster.rules` renders nothing. Exercises Task 15's Prune=false on a
  # shared ClusterRole under argocd.
  rbacCluster:
    clusterRole:
      rules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]

stateful:
  ports:
    http: 8081
  persistence:
    - name: data
      size: 1Gi

priorityClasses:
  argocd-high:
    value: 1000
    description: "shared cluster-scoped object — two Applications may declare it"

configs:
  app-config:
    data:
      LOG_LEVEL: "info"

secrets:
  app-secrets:
    secretKey: "internal/app/staging"
    properties:
      - API_KEY

jobs:
  run_task:
    hook: PreSync
    command: ["/bin/sh", "-c"]
    args: ["echo migrate"]

cronjobs:
  sync_task:
    schedule: "0 * * * *"
    command: ["/bin/sh", "-c"]
    args: ["echo sync"]
    jobAnnotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
