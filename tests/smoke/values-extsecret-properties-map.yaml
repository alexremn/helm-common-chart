# Exercises the map form of `secrets.<name>.properties`:
#   <secretKey>: <remoteProperty>
# for stores whose field names differ from the env var names the workload
# expects. The list form is covered by other variants and must keep working, so
# `plain` below stays a list in the same render.
#
# Regression: before 2.4.3 a map was accepted silently and iterated by VALUE,
# so `CA_CERT: ca-certificate` rendered `secretKey: ca-certificate` and the
# intended key was lost.
name: extsecret-properties-map
environment: production

global:
  image:
    repository: ghcr.io/example/app
    tag: "1.0.0"
  secretStore: my-cluster-store

web:
  ports:
    http: 8080
  envFrom:
    secrets:
      - renamed
      - plain

secrets:
  # map form — key written into the Secret differs from the remote field
  renamed:
    secretKey: secret/data/pki
    properties:
      CA_CERT: ca-certificate
      CA_PRIVATE_KEY: ca-private-key
      UID_SECRET_KEY: uid-secret-key
  # list form — remote field name is used verbatim as the Secret key
  plain:
    secretKey: secret/data/app
    properties:
      - TOKEN
      - API_KEY
