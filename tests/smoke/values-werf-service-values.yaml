# werf's own injected service values, as produced by
# `werf helm get-autogenerated-values` with --env set. No hand-written
# werf.name / werf.env, which is what a real werf 2.x deploy looks like.
global:
  werf:
    name: service-values-app
    version: v2.36.4
    env: production

werf:
  name: service-values-app
  namespace: service-values-app
  repo: ghcr.io/example
  version: v2.36.4
  image:
    app: ghcr.io/example/app:abc123

web:
  ports:
    http: 8080
