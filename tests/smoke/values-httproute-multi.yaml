# Change 2: <cmp>.httpRoutes - a single component serving two hostnames on
# different Gateways with different rules. Each entry renders its own
# HTTPRoute; names must be unique and distinct from any singular `httpRoute`.
name: gateway-multi-app
environment: production

global:
  image:
    repository: ghcr.io/example/app
    tag: "1.0.0"

web:
  ports:
    http: 8080
  httpRoutes:
    external:
      parentRefs:
        - name: external-gateway
          namespace: gateway-system
      hostnames:
        - account.dev.hbstf.co
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
    internal:
      parentRefs:
        - name: internal-gateway
          namespace: gateway-system
      hostnames:
        - admin.account.dev.hbstf.co
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /admin
