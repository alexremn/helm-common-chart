name: zero-app
environment: dev
zeroValues: true

global:
  image:
    repository: ghcr.io/example/app
    tag: "1.0.0"

# Every field here falls back to its default (or is omitted) only when unset or
# null. An explicit 0 is meaningful and must render as 0:
#   replicas 0             -> parked, not 1
#   minReadySeconds 0      -> no readiness debounce, not 10
#   revisionHistoryLimit 0 -> keep no old revisions, not the k8s default 10
#   terminationGracePeriod 0 -> kill immediately, not 30
#   tolerationSeconds 0    -> evict immediately, not tolerate forever (rails
#                             profile; other profiles pass tolerations through toYaml)
#   ttlSecondsAfterFinished 0 -> delete the Job as soon as it finishes
#   scaling.fallback 0     -> KEDA falls back to 0 replicas, not 1

zv_deploy_zero:
  replicas: 0
  minReadySeconds: 0
  revisionHistoryLimit: 0
  terminationGracePeriod: 0
zv_deploy_null:
  replicas: null
  minReadySeconds: null
  revisionHistoryLimit: null
  terminationGracePeriod: null
zv_deploy_unset: {}
zv_deploy_custom:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 3
  terminationGracePeriod: 60

# The rails profile renders tolerations field by field; generic passes them through toYaml.
zv_rails_zero:
  profile: rails
  tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 0
zv_rails_null:
  profile: rails
  tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: null
zv_rails_unset:
  profile: rails
  tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
zv_rails_custom:
  profile: rails
  tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300

zv_sts_zero:
  replicas: 0
  revisionHistoryLimit: 0
zv_sts_unset: {}

zv_ds_zero:
  revisionHistoryLimit: 0
# The legacy daemonSet sub-map is the fallback; its 0 must survive too...
zv_ds_fallback_zero:
  daemonSet:
    revisionHistoryLimit: 0
# ...and the flat key still wins over it.
zv_ds_flat_wins:
  revisionHistoryLimit: 2
  daemonSet:
    revisionHistoryLimit: 0
zv_ds_unset: {}

zv_scaled_zero:
  scaling:
    min: 1
    max: 3
    fallback: 0
    triggers:
      - type: cron
        timezone: UTC
        start: "0 8 * * *"
        stop: "0 20 * * *"
        desiredReplicas: "3"
zv_scaled_unset:
  scaling:
    min: 1
    max: 3
    triggers:
      - type: cron
        timezone: UTC
        start: "0 8 * * *"
        stop: "0 20 * * *"
        desiredReplicas: "3"

jobs:
  zv_job_zero:
    ttlSecondsAfterFinished: 0
  zv_job_null:
    ttlSecondsAfterFinished: null
  zv_job_custom:
    ttlSecondsAfterFinished: 600
  zv_job_unset: {}

cronjobs:
  zv_cron_zero:
    schedule: "0 * * * *"
    ttlSecondsAfterFinished: 0
  zv_cron_unset:
    schedule: "0 * * * *"
