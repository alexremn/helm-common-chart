# MUST fail to render: secrets.define needs a cluster lookup, which ArgoCD's
# repo-server cannot perform, so it would emit a fresh random on every render.
name: argocd-lookup
environment: staging

global:
  deployTool: argocd
  image:
    repository: ghcr.io/example/app
    tag: "1.0.0"

hexSecret: true

web:
  ports:
    http: 8080
